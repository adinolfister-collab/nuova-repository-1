    <script>
      // Anti-FOUC: applica subito il tema (light/dark) rispettando la
      // preferenza salvata o, in assenza, quella di sistema. Evita il flash
      // di tema sbagliato prima dell'inizializzazione di next-themes.
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
        var html = document.documentElement;
        if (dark) html.classList.add('dark');
        else html.classList.remove('dark');
      } catch (e) {}
    </script>
